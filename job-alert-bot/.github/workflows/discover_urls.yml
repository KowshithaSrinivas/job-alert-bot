name: Discover career page URLs (one-off enrichment)

# Run this manually from the Actions tab whenever you add new companies to
# data/companies.csv without a career_url, or want to re-run discovery.
# It does NOT run on a schedule -- it's a one-off/occasional tool, not part
# of the regular job-check loop.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional: only process the first N companies missing a career_url (leave blank for all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discovery
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python discover.py --limit ${{ github.event.inputs.limit }}
          else
            python discover.py
          fi

      - name: Commit updated companies.csv
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add data/companies.csv
          git diff --staged --quiet || git commit -m "Discover career page URLs [skip ci]"
          git push
